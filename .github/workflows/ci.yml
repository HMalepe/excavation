name: CI
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, lint, unit tests, secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # Builds with canary secrets and fails if any reach the browser bundle.
      - run: npm run check:secrets
      - name: Dependency audit (production dependencies must have no high or critical issues)
        run: npm audit --omit=dev --audit-level=high

  rls:
    name: Row-level-security tests (Postgres 16)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: sudo apt-get update && sudo apt-get install -y postgresql postgresql-contrib
      - run: npm ci
      - run: npm run test:db

  e2e:
    name: Smoke and accessibility (production build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:9
          NEXT_PUBLIC_SUPABASE_ANON_KEY: e2e-anon-key-not-real
          SUPABASE_SERVICE_ROLE_KEY: e2e-service-key-not-real
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3123
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with: { name: playwright-report, path: test-results, retention-days: 7 }
